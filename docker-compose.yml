name: action-quiz
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-action_quiz}
      POSTGRES_USER: ${POSTGRES_USER:-action_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-action_quiz_dev_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
  api:
    profiles: ['api']
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-action_quiz}:${POSTGRES_PASSWORD:-action_quiz_dev_only}@postgres:5432/${POSTGRES_DB:-action_quiz}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
