name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: uv sync --directory apps/api --frozen
      - run: uv run --directory apps/api --frozen ruff check . ../../scripts/check-database.py
      - run: uv run --directory apps/api --frozen ruff format --check . ../../scripts/check-database.py
      - run: uv run --directory apps/api --frozen mypy
      - run: uv run --directory apps/api --frozen pytest
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: quiz_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: action_quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz_test -d action_quiz_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://quiz_test:ci_test_only@localhost:5432/action_quiz_test
      TEST_DATABASE_URL: postgresql+asyncpg://quiz_test:ci_test_only@localhost:5432/action_quiz_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: uv sync --directory apps/api --frozen
      - run: uv run --directory apps/api --frozen alembic upgrade head
      - run: uv run --directory apps/api --frozen alembic current
      - run: uv run --directory apps/api --frozen pytest -m integration
      - run: uv run --directory apps/api --frozen alembic downgrade base
      - run: uv run --directory apps/api --frozen alembic upgrade head
